<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Infographic và video Nhiệm vụ 2.2</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #f3f4f6;
		}

		body {
			margin: 0;
		}

		main {
			width: min(100% - 32px, 960px);
			margin: 32px auto;
		}

		.card {
			padding: 24px;
			border-radius: 14px;
			background: #ffffff;
			box-shadow: 0 4px 16px #00000018;
		}

		h1 {
			margin-top: 0;
			color: #0f4c81;
		}

		.description {
			line-height: 1.6;
		}

		.infographic {
			display: block;
			width: 100%;
			max-width: 943px;
			height: auto;
			margin: 20px auto;
			border-radius: 8px;
		}

		.video {
			position: relative;
			aspect-ratio: 16 / 9;
			overflow: hidden;
			border-radius: 8px;
			background: #111827;
		}

		iframe {
			width: 100%;
			height: 100%;
			border: 0;
		}

		.note {
			margin-top: 20px;
			color: #4b5563;
			font-size: 0.9rem;
		}
	</style>
</head>
<body>
	<main>
		<section class="card">
			<h1>Infographic và video Nhiệm vụ 2.2</h1>
			<p class="description">
				Infographic dưới đây tóm tắt nội dung bài học. Video cung cấp hướng dẫn
				thực hiện Nhiệm vụ 2.2.
			</p>

			<img
				class="infographic"
				src="Lab05_Ex2.1.png"
				alt="Infographic của bài học Nhiệm vụ 2.2"
			>

			<div class="video">
				<iframe
					src="https://www.youtube.com/embed/BiVhYbCN084"
					title="Video hướng dẫn Nhiệm vụ 2.2"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
					allowfullscreen
				></iframe>
			</div>

			<p class="note">
				Bản quyền: Nội dung, hình ảnh và video thuộc về tác giả hoặc chủ sở hữu
				tương ứng. Vui lòng tôn trọng bản quyền khi sử dụng.
			</p>
		</section>
	</main>
</body>
</html>
